name: AWS NodeJs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Server's image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          scripts:
            cd /home/ubuntu/dockerci
            git pull
            docker compose up -d --build
